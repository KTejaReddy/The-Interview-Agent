version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ai-interview-backend
    ports:
      - "8000:8000"
    environment:
      # Copy .env.example to .env and fill in LLM_API_KEY (or set mock mode).
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MOCK_MODE: ${LLM_MOCK_MODE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Mount your datasets read-only so the container never modifies them.
      - ./backend/data:/app/data:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-interview-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
